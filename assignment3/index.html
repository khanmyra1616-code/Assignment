<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>coading club</title>
</head>
<body>
    <nav><a href="#events">Events</a> | <a href="#register">Register</a></nav>
    <h1>coading club</h1>

    <h2 id="register">Register</h2>
    <form action="#" method="post">
        <p><label for="'name">Nmae:</label>
           <input type="text" id="name" name="name" placeholder="your name"required></p>
        <p><label for="email">Email:</label>
            <input type="email" id="email" name="email" required></p>
        <p><label for ="pass">Password:</label>
            <input type="password" id="pass" namr="pass" required></p>  
                     <p><label for="dob">Date of birth:</label>
            <input type="date" id="dob" name="dob"></p>
        <p><label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone"></p>
        <p>Gender:
            <input type="radio" name="gender" id="male"><label for="male">Male</label>
            <input type="radio" name="gender" id="female"><label for="female">Female</label></p>
        <p>Interests:
            <input type="checkbox" id="web"><label for="web">Web</label>
            <input type="checkbox" id="dsa"><label for="dsa">DSA</label></p>
        <p><label for="branch">Branch:</label>
            <select id="branch" name="branch">
                <option>BCA</option>
                <option>B.Tech</option>
            </select></p>
        <p><label for="msg">Why do you want to join?</label><br>
            <textarea id="msg" rows="3" cols="30"></textarea></p>
        <button type="submit">Register</button>
 

    </form>
    
</body>
</html>
