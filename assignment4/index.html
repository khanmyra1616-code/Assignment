<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coding Club</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

<style>
  /* * selector: applies to everything */
  * { margin: 0; padding: 0; }

  /* font, colour, font size and line-height */
  body {
    font-family: 'Poppins', Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    color: black;
    background-color: lavender;
    padding: 16px;
  }

  /* element selector: applies to all h1 and h2 */
  h1 { font-size: 36px; }
  h2 { font-size: 24px; color: darkblue; }

  /* id selector: applies only to id="hero" */
  #hero {
    background-color: royalblue;
    color: white;
    text-align: center;
    padding: 30px;
  }

  /* class selector: applies wherever class="card" is used */
  .card {
    background-color: white;
    padding: 16px;
    margin-top: 16px;
  }

  table { width: 100%; }
  th { background-color: rgb(65, 105, 225); color: white; padding: 8px; }
  td { padding: 8px; }
  button { background-color: royalblue; color: white; padding: 8px 16px; }
</style>
</head>
<body>
  <div id="hero">
    <h1>Coding Club</h1>
    <p>Learn. Build. Share.</p>
  </div>

  <div class="card">
    <h2>Upcoming Events</h2>
    <table>
      <tr><th>Event</th><th>Date</th><th>Venue</th></tr>
      <tr><td>HTML Workshop</td><td>12 Nov</td><td>Lab 1</td></tr>
      <tr><td>Hackathon</td><td>20 Nov</td><td>Seminar Hall</td></tr>
    </table>
  </div>

  <div class="card">
    <h2>Register</h2>
    <p>Name: <input type="text" placeholder="Your name"></p>
    <p>Email: <input type="email" placeholder="you@example.com"></p>
    <button>Register</button>
  </div>
</body>
</html>
