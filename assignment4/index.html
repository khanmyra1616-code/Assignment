<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coding Club</title>
<style>
  /* 1. * selector: sab elements par lagta hai */
  * { margin: 0; padding: 0; }

  body { background-color: #eef2ff; padding: 16px; }

  /* 2. element selector: h1 aur h2 par */
  h1 { font-size: 36px; }
  h2 { color: #1b2440; }

  /* 3. id selector: sirf #hero par */
  #hero {
    background-color: #2f5bea;
    color: white;
    text-align: center;
    padding: 30px;
  }

  /* 4. class selector: jahan class="card" hai wahan */
  .card {
    background-color: white;
    padding: 16px;
    margin-top: 16px;
  }

  table { width: 100%; }
  th { background-color: #2f5bea; color: white; padding: 8px; }
  td { padding: 8px; }
  button { background-color: #2f5bea; color: white; padding: 8px 16px; }
</style>
</head>
<body>
  <div id="hero">
    <h1>Coding Club</h1>
    <p>Learn. Build. Share.</p>
  </div>

  <div class="card">
    <h2>Upcoming Events</h2>
    <table>
      <tr><th>Event</th><th>Date</th><th>Venue</th></tr>
      <tr><td>HTML Workshop</td><td>12 Nov</td><td>Lab 1</td></tr>
      <tr><td>Hackathon</td><td>20 Nov</td><td>Seminar Hall</td></tr>
    </table>
  </div>

  <div class="card">
    <h2>Register</h2>
    <p>Name: <input type="text" placeholder="Your name"></p>
    <p>Email: <input type="email" placeholder="you@example.com"></p>
    <button>Register</button>
  </div>
</body>
</html>
