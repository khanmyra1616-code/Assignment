<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profile Card</title>
<style>
  /* width will include padding and border */
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: lavender;
  }

  header {
    background-color: midnightblue;
    color: white;
    padding: 14px;
    text-align: center;
  }

  /* box model: width, padding, border, margin */
  .card {
    width: 280px;
    margin: 24px auto;
    padding: 20px;
    border: 2px solid royalblue;
    background-color: white;
    text-align: center;
  }

  .avatar { font-size: 36px; }

  .bio {
    text-align: left;
    font-size: 14px;
  }
</style>
</head>
<body>
  <header>My Profile Page</header>

  <div class="card">
    <div class="avatar">M</div>
    <h2>Myra Khan</h2>
    <p>Web Developer in Making</p>
    <div class="bio">
      Hi! I am Myra. I started coding this year. I like learning HTML, CSS and Python. My goal is to build my own app. This long text is here so that the box shows a scroll bar. Try scrolling it!
    </div>
  </div>

  <button class="fab">+</button>
</body>
</html>
