<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TravelEase</title>
<style>
  /* ---------- MOBILE LAYOUT (written first) ---------- */
  body {
    margin: 0;
    font-family: Arial;
  }

  nav {
    background-color: midnightblue;
    color: white;
    padding: 14px;
    text-align: center;
  }

  nav a {
    color: white;
    text-decoration: none;
    margin: 0 8px;
  }

  .hero {
    background-color: royalblue;
    color: white;
    padding: 40px 16px;
    text-align: center;
  }

  /* phone: 1 column */
  .features {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
    padding: 20px;
  }

  .box {
    background-color: lavender;
    padding: 20px;
    text-align: center;
  }

  footer {
    background-color: midnightblue;
    color: white;
    text-align: center;
    padding: 16px;
  }

  /* ---------- TABLET: screen 768px or wider ---------- */
  @media (min-width: 768px) {
    .features {
      grid-template-columns: 1fr 1fr;
    }
  }

  /* ---------- LAPTOP: screen 1024px or wider ---------- */
  @media (min-width: 1024px) {
    .features {
      grid-template-columns: 1fr 1fr 1fr;
    }
  }
</style>
</head>
<body>
  <nav>
    <h2>TravelEase</h2>
    <a href="#">Home</a>
    <a href="#">Trips</a>
    <a href="#">Contact</a>
  </nav>

  <div class="hero">
    <h1>Plan your next trip in minutes</h1>
    <p>Simple, cheap and fun travel plans.</p>
  </div>

  <div class="features">
    <div class="box">
      <h3>Easy Booking</h3>
      <p>Book in 3 clicks.</p>
    </div>
    <div class="box">
      <h3>Best Prices</h3>
      <p>We compare for you.</p>
    </div>
    <div class="box">
      <h3>24x7 Help</h3>
      <p>We are always online.</p>
    </div>
  </div>

  <footer>Made by a first year student</footer>
</body>
</html>
