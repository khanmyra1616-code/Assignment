<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TravelEase</title>
<style>
  /* mobile layout first */
  body {
    margin: 0;
    font-family: Arial;
    font-size: 1rem;
  }

  /* grid for the page sections */
  .page {
    display: grid;
    grid-template-columns: 1fr;
  }

  /* flexbox for the navbar */
  nav {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    background-color: midnightblue;
    color: white;
    padding: 14px;
  }

  nav a {
    color: white;
    text-decoration: none;
    margin: 0 8px;
    font-size: 0.9rem;
  }

  /* underline the link when the mouse is on it */
  nav a:hover {
    text-decoration: underline;
  }

  .hero {
    background-color: royalblue;
    color: white;
    padding: 40px 16px;
    text-align: center;
  }

  .hero h1 {
    font-size: 1.6rem;
  }

  .hero img {
    max-width: 100%;
    height: auto;
    margin-top: 16px;
  }

  .features {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
    padding: 20px;
  }

  .box {
    background-color: lavender;
    padding: 20px;
    text-align: center;
  }

  footer {
    background-color: midnightblue;
    color: white;
    text-align: center;
    padding: 16px;
    font-size: 0.9rem;
  }

  /* tablet: 768px and wider */
  @media (min-width: 768px) {
    nav {
      flex-direction: row;
      justify-content: space-between;
      padding: 14px 32px;
    }

    .hero h1 {
      font-size: 2.4rem;
    }

    .features {
      grid-template-columns: 1fr 1fr;
    }
  }

  /* desktop (laptop): 1024px and wider */
  @media (min-width: 1024px) {
    .hero h1 {
      font-size: 3rem;
    }

    .features {
      grid-template-columns: 1fr 1fr 1fr;
      padding: 40px;
    }
  }
</style>
</head>
<body>
  <div class="page">

    <nav>
      <h2>TravelEase</h2>
      <div>
        <a href="#">Home</a>
        <a href="#">Trips</a>
        <a href="#">Contact</a>
      </div>
    </nav>

    <div class="hero">
      <h1>Plan your next trip in minutes</h1>
      <p>Simple, cheap and fun travel plans.</p>
      <img src="img/hero.jpg" alt="Mountain trip banner" width="600">
    </div>

    <div class="features">
      <div class="box">
        <h3>Easy Booking</h3>
        <p>Book in 3 clicks.</p>
      </div>
      <div class="box">
        <h3>Best Prices</h3>
        <p>We compare for you.</p>
      </div>
      <div class="box">
        <h3>24x7 Help</h3>
        <p>We are always online.</p>
      </div>
    </div>

    <footer>Made by a first year student</footer>

  </div>
</body>
</html>
