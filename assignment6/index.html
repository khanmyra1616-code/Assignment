<!DOCTYPE html>
<html>
<head>
<title>CodeLab</title>
<style>
  body { margin: 0; font-family: Arial; }

  /* navbar */
  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: midnightblue;
    color: white;
    padding: 15px;
  }

  nav ul {
    display: flex;
    list-style: none;
  }

  nav li { margin: 10px; }

  nav a {
    color: white;
    text-decoration: none;
  }

  button {
    background-color: gold;
    padding: 8px 16px;
    border: none;
  }

  /* banner: text in the centre */
  .banner {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 260px;
    background-color: royalblue;
    color: white;
  }

  /* row of cards: flex-wrap moves cards to the next line when there is no space */
  .cards {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    padding: 24px;
  }

  /* flex: 1 1 200px = grow, shrink, start at 200px */
  .card {
    flex: 1 1 200px;
    background-color: lavender;
    padding: 20px;
    text-align: center;
  }
</style>
</head>
<body>
  <nav>
    <h2>CodeLab</h2>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Courses</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
    <button>Sign up</button>
  </nav>

  <div class="banner">
    <h1>Learn Web Development</h1>
    <p>Start from zero. Build real projects.</p>
    <button>Get started</button>
  </div>

  <div class="cards">
    <div class="card">
      <h3>HTML</h3>
      <p>Build the structure</p>
    </div>
    <div class="card">
      <h3>CSS</h3>
      <p>Make it beautiful</p>
    </div>
    <div class="card">
      <h3>JavaScript</h3>
      <p>Make it smart</p>
    </div>
    <div class="card">
      <h3>Git</h3>
      <p>Save your work</p>
    </div>
  </div>
</body>
</html>
