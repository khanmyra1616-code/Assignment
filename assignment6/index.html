<!DOCTYPE html>
<html>
<head>
<title>CodeLab</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body { font-family: Arial; }

  /* navbar: display flex puts the items in one row */
  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 24px;
    background-color: midnightblue;
    color: white;
  }

  /* links in a row */
  nav ul {
    display: flex;
    gap: 20px;
    list-style: none;
  }

  nav a {
    color: white;
    text-decoration: none;
  }

  .btn {
    background-color: gold;
    border: 0;
    padding: 8px 16px;
    border-radius: 6px;
    font-weight: bold;
  }
</style>
</head>
<body>
  <nav>
    <h2>CodeLab</h2>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Courses</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
    <button class="btn">Sign up</button>
  </nav>
</body>
</html>
