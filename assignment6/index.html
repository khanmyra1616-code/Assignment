<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeLab</title>
<style>
  /* Week 7: landing page with flexbox. Tested at 3 screen sizes. */
  body { margin: 0; font-family: Arial; }

  /* ---------- 1. navbar ---------- */
  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: midnightblue;
    color: white;
    padding: 15px;
  }

  nav ul {
    display: flex;
    list-style: none;
  }

  nav li { margin: 10px; }

  nav a {
    color: white;
    text-decoration: none;
  }

  button {
    background-color: gold;
    padding: 8px 16px;
    border: none;
  }

  /* ---------- 2. banner ---------- */
  .banner {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 260px;
    background-color: royalblue;
    color: white;
  }

  /* ---------- 3. row of cards ---------- */
  .cards {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    padding: 24px;
  }

  .card {
    flex: 1 1 200px;
    background-color: lavender;
    padding: 20px;
    text-align: center;
  }
</style>
</head>
<body>

  <!-- 1. navbar -->
  <nav>
    <h2>CodeLab</h2>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Courses</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
    <button>Sign up</button>
  </nav>

  <!-- 2. banner -->
  <div class="banner">
    <h1>Learn Web Development</h1>
    <p>Start from zero. Build real projects.</p>
    <button>Get started</button>
  </div>

  <!-- 3. row of cards -->
  <div class="cards">
    <div class="card">
      <h3>HTML</h3>
      <p>Build the structure</p>
    </div>
    <div class="card">
      <h3>CSS</h3>
      <p>Make it beautiful</p>
    </div>
    <div class="card">
      <h3>JavaScript</h3>
      <p>Make it smart</p>
    </div>
    <div class="card">
      <h3>Git</h3>
      <p>Save your work</p>
    </div>
  </div>

</body>
</html>
