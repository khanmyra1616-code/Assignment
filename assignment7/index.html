<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<style>
  body {
    font-family: Arial;
    background-color: lavender;
  }

  /* grid: boxes are placed in 3 columns */
  .gallery {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
  }

  .item {
    background-color: white;
    padding: 15px;
  }
</style>
</head>
<body>
  <h1>My Dashboard</h1>

  <div class="gallery">
    <div class="item">120 Users</div>
    <div class="item">Rs 45k Sales</div>
    <div class="item">36 Orders</div>
    <div class="item">4.8 Rating</div>
    <div class="item">18 Messages</div>
    <div class="item">92% Done</div>
  </div>
</body>
</html>
