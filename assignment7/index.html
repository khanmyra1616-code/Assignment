<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<style>
  /* Week 8: dashboard made with CSS Grid, checked in DevTools */
  body {
    font-family: Arial;
    background-color: lavender;
  }

  /* whole page: 2 columns, with named areas */
  .layout {
    display: grid;
    grid-template-columns: 170px 1fr;
    grid-template-areas:
      "head head"
      "side main"
      "foot foot";
    gap: 10px;
  }

  header {
    grid-area: head;
    background-color: midnightblue;
    color: white;
    padding: 14px;
  }

  aside {
    grid-area: side;
    background-color: lightsteelblue;
    padding: 14px;
  }

  main {
    grid-area: main;
  }

  footer {
    grid-area: foot;
    background-color: midnightblue;
    color: white;
    padding: 14px;
    text-align: center;
  }

  /* boxes arrange themselves */
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
  }

  /* flexbox inside each box: icon and text side by side */
  .item {
    display: flex;
    align-items: center;
    gap: 10px;
    background-color: white;
    padding: 15px;
  }

  .icon {
    font-size: 28px;
  }
</style>
</head>
<body>
  <div class="layout">

    <header>
      <h2>My Dashboard</h2>
    </header>

    <aside>
      <h3>Menu</h3>
      <ul>
        <li>Home</li>
        <li>Reports</li>
        <li>Settings</li>
      </ul>
    </aside>

    <main>
      <div class="gallery">
        <div class="item"><span class="icon">👤</span><p>120 Users</p></div>
        <div class="item"><span class="icon">💰</span><p>Rs 45k Sales</p></div>
        <div class="item"><span class="icon">📦</span><p>36 Orders</p></div>
        <div class="item"><span class="icon">⭐</span><p>4.8 Rating</p></div>
        <div class="item"><span class="icon">💬</span><p>18 Messages</p></div>
        <div class="item"><span class="icon">✅</span><p>92% Done</p></div>
      </div>
    </main>

    <footer>Made with CSS Grid</footer>

  </div>
</body>
</html>
