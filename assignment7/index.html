<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<style>
  body {
    margin: 0;
    font-family: Arial;
    background-color: lavender;
  }

  /* whole page: 2 columns and 3 rows, with names for each area */
  .layout {
    display: grid;
    grid-template-columns: 170px 1fr;
    grid-template-areas:
      "head head"
      "side main"
      "foot foot";
    gap: 10px;
    padding: 10px;
  }

  /* each part goes to its named area */
  header {
    grid-area: head;
    background-color: midnightblue;
    color: white;
    padding: 14px;
  }

  aside {
    grid-area: side;
    background-color: lightsteelblue;
    padding: 14px;
  }

  main {
    grid-area: main;
  }

  footer {
    grid-area: foot;
    background-color: midnightblue;
    color: white;
    padding: 14px;
    text-align: center;
  }

  /* boxes arrange themselves */
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
  }

  .item {
    background-color: white;
    padding: 15px;
  }
</style>
</head>
<body>
  <div class="layout">

    <header>
      <h2>My Dashboard</h2>
    </header>

    <aside>
      <h3>Menu</h3>
      <ul>
        <li>Home</li>
        <li>Reports</li>
        <li>Settings</li>
      </ul>
    </aside>

    <main>
      <div class="gallery">
        <div class="item">120 Users</div>
        <div class="item">Rs 45k Sales</div>
        <div class="item">36 Orders</div>
        <div class="item">4.8 Rating</div>
        <div class="item">18 Messages</div>
        <div class="item">92% Done</div>
      </div>
    </main>

    <footer>Made with CSS Grid</footer>

  </div>
</body>
</html>
